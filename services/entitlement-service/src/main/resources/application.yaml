# ── Server ──────────────────────────────────────────────
server:
  port: ${ENTITLEMENT_SERVICE_PORT:8088}

# ── Service Discovery ─────────────────────────────────────────
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}

# ── Spring Boot Core ──────────────────────────────────────────
spring:
  application:
    name: entitlement-service

  # ── Database (PostgreSQL/JPA) ───────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ENTITLEMENT_DB:entitlement_db}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:pass}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # ── Database Migration (Flyway) ─────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      outbox_publication_name: entitlement_outbox_publication

  # ── Kafka Messaging ─────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KF_BOOTSTRAP_SERVERS:localhost:9092}

    template:
      observation-enabled: true

    listener:
      concurrency: 3
      ack-mode: manual_immediate
      observation-enabled: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

    consumer:
      group-id: ${KF_CONSUMER_GROUP_ID:entitlement-service-group}
      auto-offset-reset: ${KF_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
        derive.type: true

    properties:
      schema.registry.url: ${SC_REGISTRY_URL:http://localhost:8181}
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
      reference.subject.name.strategy: io.confluent.kafka.serializers.subject.QualifiedReferenceSubjectNameStrategy
      auto.register.schemas: false
      use.latest.version: true

# ── Observability ────────────────────────────────────────────────
management:
  server:
    port: ${MANAGEMENT_PORT:8070}      # Separate port for actuator
  endpoints:
    web:
      exposure:
        include: health, prometheus      # Only expose health and Prometheus metrics
  endpoint:
    health:
      show-details: always      # Show component details (db, kafka) in health, dev only
  otlp:
    metrics:
      export:
        enabled: false      # Metrics are pulled by Prometheus, not pushed via OTLP
  metrics:
    tags:
      application: ${spring.application.name}      # Adds the service name to every metric
    distribution:
      percentiles-histogram:
        http.server.requests: true      # Enables p95/p99 on HTTP latency
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT}      # Where traces are sent (Tempo)
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}      # Share of requests traced (1.0 = all, lower in prod)

# ── entitlement Config ─────────────────────────────────────────────
app:
  security:
    hmac:
      secret: ${HMAC_SECRET_KEY}

api:
  base-path: /api/v1

orderflow:
  kafka:
    topics:
      inventory:
        item-events: orderflow.inventory.item-events
      entitlement-commands: orderflow.entitlement.commands