spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── Database Migration (Flyway) ─────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: false
    placeholders:
      outbox_publication_name: order_outbox_publication
    locations:
      - classpath:db/migration

  # ── Kafka Messaging ─────────────────────────────────────────
  kafka:
    properties:
      auto.register.schemas: true