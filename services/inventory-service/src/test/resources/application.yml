spring:
  grpc:
    server:
      port: 0        # Uses dynamic ephemeral port if server is required

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── Database Migration (Flyway) ─────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations:
      - classpath:db/migration