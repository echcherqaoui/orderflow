# ── Server ──────────────────────────────────────────────
server:
  port: ${INVENTORY_SERVICE_PORT:8082}

# ── Service Discovery ─────────────────────────────────────────
eureka:
  client:
    enabled: false

# ── Spring Boot Core ──────────────────────────────────────────
spring:
  application:
    name: inventory-service

  # ── gRPC ─────────────────────────────────────────────────────
  grpc:
    server:
      port: ${INVENTORY_SERVICE_GRPC_PORT:9082}

  # ── Database (PostgreSQL/JPA) ───────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${PG_PORT:5432}/${INVENTORY_DB:inventory_db}
    username: ${PG_USER:user}
    password: ${PG_PASSWORD:pass}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # ── Database Migration (Flyway) ─────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      outbox_publication_name: inventory_outbox_publication

  # ── Kafka Messaging ─────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KF_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: 3
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

    consumer:
      group-id: ${KF_ORDER_CONSUMER_GROUP_ID:inventory-service-group}
      auto-offset-reset: ${KF_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
        derive.type: true

    properties:
      schema.registry.url: ${SC_REGISTRY_URL:http://localhost:8181}
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
      reference.subject.name.strategy: io.confluent.kafka.serializers.subject.QualifiedReferenceSubjectNameStrategy
      auto.register.schemas: false
      use.latest.version: true

# ── Inventory Config ─────────────────────────────────────────────
app:
  security:
    hmac:
      secret: ${HMAC_SECRET_KEY:dev_secret_key_123456789_local}

orderflow:
  kafka:
    topics:
      inventory-commands: orderflow.inventory.commands