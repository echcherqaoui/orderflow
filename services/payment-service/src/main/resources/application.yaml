# ── Server ──────────────────────────────────────────────
server:
  port: ${PAYMENT_SERVICE_PORT:8086}

# ── Service Discovery ─────────────────────────────────────────
eureka:
  client:
    enabled: false

# ── Spring Boot Core ──────────────────────────────────────────
spring:
  application:
    name: payment-service

  # ── Database (PostgreSQL/JPA) ───────────────────────────────
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PAYMENT_DB:payment_db}
    username: ${PG_USER:user}
    password: ${PG_PASSWORD:pass}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # ── Database Migration (Flyway) ─────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      outbox_publication_name: payment_outbox_publication

  # ── Kafka Messaging ─────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KF_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: 3
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

    consumer:
      group-id: ${KF_PAYMENT_CONSUMER_GROUP_ID:payment-service-group}
      auto-offset-reset: ${KF_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
        derive.type: true

    properties:
      schema.registry.url: ${SC_REGISTRY_URL:http://localhost:8181}
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
      reference.subject.name.strategy: io.confluent.kafka.serializers.subject.QualifiedReferenceSubjectNameStrategy
      auto.register.schemas: false
      use.latest.version: true

# ── Actuator (Dev Tooling) ───────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: env, refresh  #(dev-only: toggle @RefreshScope beans without restart)
  endpoint:
    env:
      post:
        enabled: true

# ── Order Config ─────────────────────────────────────────────
app:
  security:
    hmac:
      secret: ${HMAC_SECRET_KEY:dev_secret_key_123456789_local}

orderflow:
  kafka:
    topics:
      payment-commands: orderflow.payment.commands
  mock-psp:
    simulate-outage: false
