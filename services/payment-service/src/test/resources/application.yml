spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    placeholders:
      outbox_publication_name: payment_outbox_publication
    locations:
      - classpath:db/migration

  kafka:
    properties:
      auto.register.schemas: true