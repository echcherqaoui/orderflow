syntax = "proto3";

package orderflow.entitlement.commands.v1;

option java_package = "com.echcherqaoui.orderflow.contracts.entitlement.commands.v1";
option java_multiple_files = true;

import "orderflow/common/v1/metadata.proto";

message GrantEntitlementCommand {
  orderflow.common.v1.MessageMetadata metadata = 1;
  string user_id = 2;
  string order_id = 3;
  repeated string item_ids = 4;
}