# ── API & Server ──────────────────────────────────────────────
server:
  port: ${GATEWAY_PORT:8080}

# ── Spring Boot Core ──────────────────────────────────────────
spring:
  application:
    name: gateway-service

# ── Spring Cloud Gateway ──────────────────────────────────────
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # ENTITLEMENT SERVICE
            - id: entitlement-service
              uri: lb://entitlement-service
              predicates:
                - Path=/api/v1/admin/licenses/**

            # ORDER SERVICE
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders, /api/v1/orders/**

            # PAYMENT SERVICE
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/mock-stripe/payment_intents/**
  reactor:
    context-propagation: auto # Keeps trace context across reactive thread switches
# ── Service Discovery ───────────────────────────────────────────
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}

# ── Logging ─────────────────────────────────────────────────────
logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:DEBUG}


# ── Observability ────────────────────────────────────────────────
management:
  server:
    port: ${MANAGEMENT_PORT:8070}      # Separate port for actuator
  endpoints:
    web:
      exposure:
        include: health, prometheus      # Only expose health and Prometheus metrics
  endpoint:
    health:
      show-details: always      # Show component details (db, kafka) in health, dev only
  otlp:
    metrics:
      export:
        enabled: false      # Metrics are pulled by Prometheus, not pushed via OTLP
  metrics:
    tags:
      application: ${spring.application.name}      # Adds the service name to every metric
    distribution:
      percentiles-histogram:
        http.server.requests: true      # Enables p95/p99 on HTTP latency
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT}      # Where traces are sent (Tempo)
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}      # Share of requests traced (1.0 = all, lower in prod)
