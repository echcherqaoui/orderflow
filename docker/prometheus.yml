global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'gateway-service:8070' ]
        labels:
          namespace: 'development'

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'inventory-service:8072' ]
        labels:
          namespace: 'development'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'order-service:8074' ]
        labels:
          namespace: 'development'

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'payment-service:8076' ]
        labels:
          namespace: 'development'

  - job_name: 'entitlement-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'entitlement-service:8078' ]
        labels:
          namespace: 'development'